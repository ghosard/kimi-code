name: Publish fork to npm

on:
  push:
    tags:
      - "npm-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example 0.36.1
        required: true
        type: string

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @ghosard/kimi-coded
    if: github.repository == 'ghosard/kimi-code'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for Trusted Publishing
        run: npm install --global npm@11

      - name: Resolve package version
        id: package
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#npm-v}"
          else
            version="$INPUT_VERSION"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Kimi Code built-in catalog
        shell: bash
        run: |
          catalog_file="$RUNNER_TEMP/kimi-code-built-in-catalog.json"
          node apps/kimi-code/scripts/update-catalog.mjs --out "$catalog_file"
          echo "KIMI_CODE_BUILT_IN_CATALOG_FILE=$catalog_file" >> "$GITHUB_ENV"

      - name: Build packages
        run: pnpm build
        env:
          KIMI_CODE_NPM_PACKAGE_NAME: "@ghosard/kimi-coded"

      - name: Prepare fork package metadata
        working-directory: apps/kimi-code
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          npm pkg set name="@ghosard/kimi-coded"
          npm pkg set version="$PACKAGE_VERSION"
          npm pkg set author="ghosard"
          npm pkg set homepage="https://github.com/ghosard/kimi-code#readme"
          npm pkg set repository.type="git"
          npm pkg set repository.url="git+https://github.com/ghosard/kimi-code.git"
          npm pkg set repository.directory="apps/kimi-code"
          npm pkg set bugs.url="https://github.com/ghosard/kimi-code/issues"

      - name: Verify fork package identity
        working-directory: apps/kimi-code
        run: |
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("package.json", "utf8"));
            const bundle = readFileSync("dist/main.mjs", "utf8");
            if (manifest.name !== "@ghosard/kimi-coded") {
              throw new Error(`Unexpected package name: ${manifest.name}`);
            }
            if (!bundle.includes("@ghosard/kimi-coded")) {
              throw new Error("CLI bundle does not contain the fork package name");
            }
          '

      - name: Inspect npm package
        working-directory: apps/kimi-code
        run: npm pack --dry-run

      - name: Publish npm package
        working-directory: apps/kimi-code
        run: npm publish --access public --provenance
